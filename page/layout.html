<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Corbie</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="stylesheet" href="/assets/ui.css">
<svg class="sprite" aria-hidden="true">
  <defs><linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="20" y2="0"><stop offset="0" style="stop-color:var(--s1)"/><stop offset=".55" style="stop-color:var(--s2)"/><stop offset="1" style="stop-color:var(--s3)"/></linearGradient></defs>
  <symbol id="g-flow" viewBox="0 0 20 14"><rect x="1" y="5" width="5" height="4" rx="1"/><rect x="14" y="1" width="5" height="4" rx="1"/><rect x="14" y="9" width="5" height="4" rx="1"/><path d="M6 7C10 7 10 3 14 3M6 7C10 7 10 11 14 11"/></symbol>
  <symbol id="g-statechart" viewBox="0 0 20 14"><rect x="1" y="1.5" width="7.5" height="5" rx="2.5"/><rect x="11.5" y="1.5" width="7.5" height="5" rx="2.5"/><path d="M8.5 4H11.5M15.25 6.5C15.25 11.5 4.75 11.5 4.75 6.5"/></symbol>
  <symbol id="g-agent" viewBox="0 0 20 14"><path d="M10 .8C10.5 4.6 11.4 5.5 15.2 7C11.4 8.5 10.5 9.4 10 13.2C9.5 9.4 8.6 8.5 4.8 7C8.6 5.5 9.5 4.6 10 .8Z"/></symbol>
  <symbol id="g-script" viewBox="0 0 20 14"><path d="M5 3.5L9 7L5 10.5M11 10.5H15.5"/></symbol>
  <symbol id="g-toolkit" viewBox="0 0 20 14"><rect x="3" y="1" width="6" height="5" rx="1.2"/><rect x="11" y="1" width="6" height="5" rx="1.2"/><rect x="3" y="8" width="6" height="5" rx="1.2"/><rect x="11" y="8" width="6" height="5" rx="1.2"/></symbol>
  <symbol id="g-file" viewBox="0 0 20 14"><path d="M6.5 1H11.5L14 3.5V13H6.5ZM11.5 1V3.5H14"/></symbol>
</svg>
<header class="header">
  <a class="logo" href="/"><svg class="crow" viewBox="-62 -48 142 110" aria-hidden="true"><path d="M-58 6L-26-44L16-34Z" fill-opacity=".95"/><path d="M16-34L76-4L22 8Z" fill-opacity=".8"/><path d="M22 8L76-4L30 20Z" fill-opacity=".55"/><path d="M-58 6L16-34L22 8Z" fill-opacity=".7"/><path d="M-58 6L22 8L8 44Z" fill-opacity=".5"/><path d="M-58 6L8 44L-44 58Z" fill-opacity=".35"/><circle cx="-4" cy="-16" r="5.5"/></svg>Corbie</a>
  <nav>{{range .Offered}}<a href="/{{lower .}}"{{if eq . $.Current}} aria-current="page"{{end}}>{{.}}</a>{{end}}<a href="/manual/" target="_blank" rel="noopener">Manual</a></nav>
  <p class="as">{{if .Parties}}as {{range .Parties}}<code>{{.}}</code>{{end}}{{else if .NoStore}}<span title="{{.NoStore}}">no store</span>{{else}}a viewer{{end}}<span class="live{{if not .Stream}} still{{end}}" id="live" title="following the store"></span></p>
</header>
<main{{if .Stream}} data-stream="{{.Stream}}"{{end}}>
{{.Main}}
</main>
<script src="/assets/ui.js"></script>
{{if .Script}}<script src="{{.Script}}"></script>{{end}}
</html>

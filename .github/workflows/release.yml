name: release

# A person starts a release and gives it a version, such as 0.3.0. The
# binaries are built, and the release is tagged with that version.
# Nothing in the code changes for a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release: 0.3.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the last step creates the release; no other step is given the token
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the version
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the version is major.minor.patch, such as 0.3.0, not \"$VERSION\""; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released"; exit 1
          fi

      - uses: jdx/mise-action@v5

      - run: mise run check

      - run: mise run dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Built from $GITHUB_SHA."
